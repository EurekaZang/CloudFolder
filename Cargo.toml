[package]
name = "cloudfolder-service"
version = "0.9.1"
edition = "2021"
license = "MIT"
description = "Local-first Windows bridge for reliable remote Linux workspaces"
repository = "https://github.com/EurekaZang/CloudFolder"

[[bin]]
name = "CloudFolderService"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
