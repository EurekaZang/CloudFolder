name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test
        run: |
          cargo fmt -- --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate and package VS Code bridge
        shell: powershell
        run: |
          node --check .\editors\vscode\extension.js
          node -e "JSON.parse(require('fs').readFileSync('.\\editors\\vscode\\package.json','utf8')); console.log('VS Code manifest OK')"
          Push-Location .\editors\vscode
          npm ci
          npm run package -- --out ..\..\CloudFolder-vscode.vsix
          Pop-Location

      - name: Build release binary
        run: cargo build --release

      - name: Build release ZIP
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'release-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item '.\target\release\CloudFolderService.exe' $stage
          Copy-Item '.\target\release\cf.exe' $stage
          Copy-Item '.\CloudFolder.ps1' $stage
          Copy-Item '.\cf.ps1' $stage
          Copy-Item '.\Install CloudFolder.cmd' $stage
          Copy-Item '.\CloudFolder Manager.cmd' $stage
          Copy-Item '.\Uninstall CloudFolder.cmd' $stage
          Copy-Item '.\README.md' $stage
          Copy-Item '.\README.en.md' $stage
          Copy-Item '.\README.ja.md' $stage
          Copy-Item '.\CHANGELOG.md' $stage
          Copy-Item '.\SECURITY.md' $stage
          Copy-Item '.\LICENSE' $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'config') | Out-Null
          Copy-Item '.\config\workspace.toml.example' (Join-Path $stage 'config')
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'scripts') | Out-Null
          Copy-Item '.\scripts\formal-gate.ps1' (Join-Path $stage 'scripts')
          Copy-Item '.\scripts\ssh-config-gate.ps1' (Join-Path $stage 'scripts')
          $editorStage = Join-Path $stage 'editors\vscode'
          New-Item -ItemType Directory -Force -Path $editorStage | Out-Null
          Copy-Item '.\editors\vscode\extension.js' $editorStage
          Copy-Item '.\editors\vscode\package.json' $editorStage
          Copy-Item '.\editors\vscode\package-lock.json' $editorStage
          Copy-Item '.\editors\vscode\README.md' $editorStage
          Copy-Item '.\LICENSE' (Join-Path $editorStage 'LICENSE')
          Copy-Item '.\CloudFolder-vscode.vsix' $stage
          Compress-Archive -Path "$stage\*" -DestinationPath '.\CloudFolder-windows-x64.zip' -Force
          $hash = (Get-FileHash '.\CloudFolder-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CloudFolder-windows-x64.zip" | Set-Content '.\CloudFolder-windows-x64.zip.sha256' -Encoding ascii

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            '.\CloudFolder-windows-x64.zip' `
            '.\CloudFolder-windows-x64.zip.sha256' `
            '.\CloudFolder-vscode.vsix' `
            --repo '${{ github.repository }}' `
            --title 'CloudFolder ${{ github.ref_name }}' `
            --generate-notes
