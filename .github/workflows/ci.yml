name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt -- --check
      - name: Rust tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: PowerShell 5.1 parse check
        shell: powershell
        run: |
          $files = @('.\CloudFolder.ps1','.\cf.ps1','.\install.ps1','.\scripts\build.ps1','.\scripts\smoke-test.ps1','.\scripts\fault-test.ps1','.\scripts\formal-gate.ps1','.\scripts\ssh-config-gate.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message) at line $($_.Extent.StartLineNumber)" }
              exit 1
            }
          }
